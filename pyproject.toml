[project]
name = "heidisql-settings-export-parser"
version = "0.1.0"
description = "Parse and inspect HeidiSQL settings exports"
readme = "README.md"
requires-python = ">=3.10"

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.13,<1"]

[tool.ruff]
line-length = 100
target-version = "py310"
