name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.15"
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check formatting and lint
        run: |
          uv run ruff format --check heidi_decode.py tests
          uv run ruff check --select E9,F63,F7,F82 heidi_decode.py tests
      - name: Compile sources
        run: uv run python -m compileall -q heidi_decode.py tests
      - name: Build distributions
        run: uv build
      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          WHEEL="$(realpath dist/*.whl)"
          cd "$(mktemp -d)"
          uv tool run --isolated --from "$WHEEL" heidi-decode --help
