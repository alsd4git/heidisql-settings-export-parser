name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Tag $RELEASE_TAG does not match project version $PACKAGE_VERSION" >&2
            exit 1
          }
          grep -F "## [$PACKAGE_VERSION]" CHANGELOG.md
      - run: uv sync --locked --dev
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build
      - name: Smoke-test wheel outside the checkout
        run: |
          WHEEL="$(realpath dist/*.whl)"
          cd "$(mktemp -d)"
          uv tool run --isolated --from "$WHEEL" heidi-decode --help
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
