name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Tag $RELEASE_TAG does not match project version $PACKAGE_VERSION" >&2
            exit 1
          }
      - run: uv sync --locked --dev
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build
      - name: Smoke-test wheel
        run: |
          uv venv .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          .release-venv/bin/heidi-decode --help
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
